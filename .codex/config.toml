# Project-level Codex configuration for the AI Workbench.
# Codex reads AGENTS.md natively; skills are discovered from .agents/skills/.
# Note: project-level config cannot override the provider or base URL.

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
WORKSPACE_TYPE = "productivity"

# Subagent defaults for the routing table in AGENTS.md.
# Whole-session tier profiles (luna, sol, astra) are per machine: see
# Appendix B of guides/model-routing-guide.md for the ~/.codex/<name>.config.toml files.
[agents]
# Ad hoc spawns without a named role land on the balanced tier.
# The roster files in .codex/agents/ pin the cheap roles to gpt-6-luna explicitly.
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"
max_concurrent_threads_per_session = 6
